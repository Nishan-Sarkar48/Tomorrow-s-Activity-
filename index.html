<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tracker App</title>

<style>
body {
  margin:0;
  font-family:sans-serif;
  background:#10141f;
  color:white;
}

.container {
  max-width:500px;
  margin:auto;
  padding:15px;
}

input {
  width:70%;
  padding:10px;
  border:none;
  border-radius:8px;
}

button {
  padding:10px;
  border:none;
  border-radius:8px;
  margin-left:5px;
  cursor:pointer;
}

.save { background:#28a745; color:white; }
.delete { background:red; color:white; }
.restore { background:orange; color:white; }

.item {
  background:#1c2436;
  padding:10px;
  margin-top:10px;
  border-radius:8px;
  display:flex;
  justify-content:space-between;
}

.section-title {
  margin-top:20px;
  font-weight:bold;
}
</style>
</head>

<body>

<div class="container">

<h2>Tracker</h2>

<input type="text" id="inputBox" placeholder="Write something...">
<button class="save" onclick="addItem()">Save</button>

<div id="list"></div>

<div class="section-title">🗑 Recycle Bin</div>
<div id="trash"></div>

</div>

<script>

// LOAD DATA
let data = JSON.parse(localStorage.getItem("data")) || [];
let trash = JSON.parse(localStorage.getItem("trash")) || [];

// SAVE STORAGE
function updateStorage() {
  localStorage.setItem("data", JSON.stringify(data));
  localStorage.setItem("trash", JSON.stringify(trash));
}

// ADD ITEM
function addItem() {
  let input = document.getElementById("inputBox");
  let text = input.value.trim();

  if(text === "") return;

  data.push(text);
  input.value = "";

  updateStorage();
  render();
}

// DELETE (MOVE TO TRASH)
function deleteItem(index) {
  if(confirm("Are you sure to delete?")) {
    trash.push(data[index]);
    data.splice(index,1);

    updateStorage();
    render();
  }
}

// RESTORE
function restoreItem(index) {
  data.push(trash[index]);
  trash.splice(index,1);

  updateStorage();
  render();
}

// PERMANENT DELETE
function permanentDelete(index) {
  if(confirm("Delete permanently?")) {
    trash.splice(index,1);

    updateStorage();
    render();
  }
}

// RENDER UI
function render() {

  let list = document.getElementById("list");
  let trashDiv = document.getElementById("trash");

  list.innerHTML = "";
  trashDiv.innerHTML = "";

  data.forEach((item,index)=>{
    list.innerHTML += `
      <div class="item">
        ${item}
        <button class="delete" onclick="deleteItem(${index})">Delete</button>
      </div>
    `;
  });

  trash.forEach((item,index)=>{
    trashDiv.innerHTML += `
      <div class="item">
        ${item}
        <div>
          <button class="restore" onclick="restoreItem(${index})">Restore</button>
          <button class="delete" onclick="permanentDelete(${index})">X</button>
        </div>
      </div>
    `;
  });
}

// FIRST LOAD
render();

</script>

</body>
</html>
